[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-switchboard"
dynamic = ["version"]
description = "Connect applications that use different protocols without extra infrastructure."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.11"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["switchboard", "gateway", "protocols", "networking", "cli"]

dependencies = [
  "aiohttp>=3.11",
  "platformdirs>=4",
  "pydantic>=2",
  "PyYAML>=6",
  "rich>=13",
  "typer>=0.12",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/lupaxa-developers-toolbox/switchboard"
Repository = "https://github.com/lupaxa-developers-toolbox/switchboard"
Issues = "https://github.com/lupaxa-developers-toolbox/switchboard/issues"

[project.scripts]
switchboard = "lupaxa.switchboard.cli:main"

[project.optional-dependencies]
tui = [
  "textual>=1.0",
]
dev = [
  "hypothesis>=6.100",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
  "textual>=1.0",
]
test = [
  "hypothesis>=6.100",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
]

[tool.hatch.version]
path = "src/lupaxa/switchboard/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["lupaxa"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
